name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: true
      diagnostic_once:
        description: One configured sticker attempt with no resend
        type: boolean
        default: false
  # 使用 GitHub Actions 的日程时把下面三行注释删掉；用外部 cron 不用管
  # schedule:
  #   - cron: "0 0 * * *"
  #     timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE || secrets.DOUYIN_COOKLE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG || secrets.DOUTIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Write multi-account configuration
        shell: bash
        env:
          COOKIE_1: ${{ secrets.DOUYIN_COOKIE_ACCOUNT1 }}
          CONFIG_1: ${{ secrets.DOUYIN_CONFIG_ACCOUNT1 }}
          COOKIE_2: ${{ secrets.DOUYIN_COOKIE_ACCOUNT2 }}
          CONFIG_2: ${{ secrets.DOUYIN_CONFIG_ACCOUNT2 }}
          COOKIE_3: ${{ secrets.DOUYIN_COOKIE_ACCOUNT3 }}
          CONFIG_3: ${{ secrets.DOUYIN_CONFIG_ACCOUNT3 }}
          COOKIE_4: ${{ secrets.DOUYIN_COOKIE_ACCOUNT4 }}
          CONFIG_4: ${{ secrets.DOUYIN_CONFIG_ACCOUNT4 }}
          COOKIE_5: ${{ secrets.DOUYIN_COOKIE_ACCOUNT5 }}
          CONFIG_5: ${{ secrets.DOUYIN_CONFIG_ACCOUNT5 }}
          LEGACY_COOKIE: ${{ secrets.DOUYIN_COOKIE || secrets.DOUYIN_COOKLE }}
          LEGACY_CONFIG: ${{ secrets.DOUYIN_CONFIG || secrets.DOUTIN_CONFIG }}
        run: |
          mkdir -p config/tasks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def task_config(value, secret_name):
              if not value or not value.strip():
                  raise SystemExit(f"{secret_name} 未配置或为空；请在 Actions Repository secrets 中添加任务 JSON")
              try:
                  parsed = json.loads(value.lstrip("\ufeff"))
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"{secret_name} 不是有效 JSON（第 {exc.lineno} 行，第 {exc.colno} 列）；"
                      "请粘贴完整 JSON，不要填写文件名、Markdown 代码块或注释"
                  ) from None
              if not isinstance(parsed, dict):
                  raise SystemExit(f"{secret_name} 必须是 JSON 对象，不能是数组或字符串")
              return json.dumps(parsed, ensure_ascii=False, indent=2)

          if not any(os.environ.get(f"{kind}_{i}") for i in range(1, 6) for kind in ("COOKIE", "CONFIG")):
              # 没有配置任何多账号 Secret（DOUYIN_COOKIE_ACCOUNTn）：
              # 保持旧单账号模式，不生成 accounts.json。
              config = task_config(os.environ.get("LEGACY_CONFIG"), "DOUYIN_CONFIG")
              Path("config.json").write_text(config, encoding="utf-8")
              print("DOUYIN_CONFIG JSON 校验通过，继续使用旧单账号模式")
              raise SystemExit(0)

          accounts = []
          for index in range(1, 6):
              if index == 1 and not os.environ.get("COOKIE_1") and not os.environ.get("CONFIG_1"):
                  # 没有配置 DOUYIN_COOKIE_ACCOUNT1 时，旧版 DOUYIN_COOKIE /
                  # DOUYIN_CONFIG 自动作为账号1，方便老用户直接追加新账号。
                  config_secret = "DOUYIN_CONFIG"
                  cookie = os.environ.get("LEGACY_COOKIE")
                  config = os.environ.get("LEGACY_CONFIG")
              else:
                  config_secret = f"DOUYIN_CONFIG_ACCOUNT{index}"
                  cookie = os.environ.get(f"COOKIE_{index}")
                  config = os.environ.get(f"CONFIG_{index}")
              if not cookie and not config:
                  continue
              if not cookie or not config:
                  raise SystemExit(
                      f"账号 account{index} 的 DOUYIN_COOKIE_ACCOUNT{index} 与 "
                      f"DOUYIN_CONFIG_ACCOUNT{index} 必须同时配置"
                  )
              # 提前校验，出错时直接指出是哪个 Secret，避免任务执行时才报错
              try:
                  json.loads(cookie)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"DOUYIN_COOKIE_ACCOUNT{index} 不是有效 JSON: {exc}") from exc
              config = task_config(config, config_secret)
              env_file = f".env.account{index}"
              # Cookie 用 JSON 字符串转义后写入，dotenv 可精确还原，
              # 兼容多行 Cookie JSON 与 # 等特殊字符
              Path(env_file).write_text(
                  f"DOUYIN_COOKIE={json.dumps(cookie)}\nTASK_CONFIG=config/tasks/account{index}.json\n",
                  encoding="utf-8",
              )
              Path(f"config/tasks/account{index}.json").write_text(config, encoding="utf-8")
              accounts.append({"id": f"account{index}", "enabled": True, "env_file": env_file})
          Path("config/accounts.json").write_text(
              json.dumps({"accounts": accounts}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Run
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            python run.py --dry-run
          elif [[ "${{ inputs.diagnostic_once }}" == "true" ]]; then
            python - <<'DIAGNOSTIC'
          """One configured sticker attempt; no resend, no trace or notification."""
          import asyncio
          from dataclasses import replace
          import os
          from pathlib import Path
          
          os.environ['TRACE'] = 'false'
          for key in ('DINGTALK_WEBHOOK', 'DINGTALK_SECRET', 'WEBHOOK_URL', 'WEBHOOK_HEADERS', 'WEBHOOK_TEMPLATE'):
              os.environ.pop(key, None)
          
          import app.main as runner
          import app.sender as sender
          from app.accounts import load_accounts
          from app.douyin import PageOperationError
          
          if load_accounts() is not None:
              raise SystemExit('Single diagnostic send requires single-account mode; nothing sent')
          task = runner.load_task(runner.load_settings())
          if len(task.targets) != 1 or len(task.targets[0].messages) != 1:
              raise SystemExit('Single diagnostic send requires exactly one target and one message; nothing sent')
          message = task.targets[0].messages[0]
          if message.type != 'douyin_sticker' or message.sticker != '续火花':
              raise SystemExit('Single diagnostic send only permits the configured 续火花 sticker; nothing sent')
          sticker = task.stickers[message.sticker]
          if (sticker.accessible_name or sticker.name) != '续火花':
              raise SystemExit('Sticker label mismatch; nothing sent')
          
          task.stickers[message.sticker] = replace(sticker, fallback_index=None)
          runner.load_task = lambda settings: task
          
          async def no_retry(*args):
              return False
          
          sender._click_retry_on_latest_failed_message = no_retry
          sender._publish_ready = no_retry
          original = sender._await_send_terminal_state
          
          async def observe(page, scope, label, *args, **kwargs):
              try:
                  return await original(page, scope, label, *args, **kwargs)
              except PageOperationError:
                  # Inspect only the failed bubble's status marker and its tooltip.
                  # Never inspect network traffic, auth state, trace, or other chats.
                  for selector in sender.SEND_FAILURE_MARKERS:
                      marker = scope.locator(selector).first
                      if await marker.count() and await marker.is_visible():
                          try:
                              await marker.hover(timeout=2000)
                              await page.wait_for_timeout(500)
                              tooltips = page.get_by_role('tooltip')
                              known = ('安全验证', '操作频繁', '网络异常', '网络错误', '发送失败', '重试', '风险', '未登录', '登录失效', '限制', '不支持', '版本', '客户端')
                              texts = []
                              for index in range(await tooltips.count()):
                                  tip = tooltips.nth(index)
                                  if await tip.is_visible():
                                      texts.append(await tip.inner_text())
                              for attribute in ('title', 'aria-label'):
                                  texts.append(await marker.get_attribute(attribute) or '')
                              # Log fixed diagnostic keywords only, never raw page text.
                              found = [word for word in known if any(word in text for text in texts)]
                              runner.LOGGER.error('Single attempt failure tooltip keywords: %s', ', '.join(found) or 'no specific tooltip')
                              await page.screenshot(path='artifacts/single-attempt-failure.png')
                          except Exception:
                              runner.LOGGER.error('Could not inspect failure tooltip')
                          break
                  raise
          
          sender._await_send_terminal_state = observe
          print('Guard passed: one target, one configured 续火花 sticker; retries disabled')
          raise SystemExit(asyncio.run(runner.run(dry_run=False)))
          DIAGNOSTIC
          else
            python run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
